name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Python project lives under python/; run all shell steps there. (checkout/setup-python
    # use `uses:` and are unaffected; they operate on the repo root.)
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format check (black)
        run: black --check salesforce_zerobus tests
      - name: Import-order check (isort)
        run: isort --check-only salesforce_zerobus tests
      - name: Type check (mypy — informational until the codebase is fully annotated)
        run: mypy salesforce_zerobus
        continue-on-error: true
      - name: Run test suite
        # test_nested_fields.py requires pyspark + dlt (Databricks-only); skip in CI.
        run: pytest tests/ -v --ignore=tests/test_nested_fields.py
