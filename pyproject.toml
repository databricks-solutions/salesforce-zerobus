[build-system]
requires = ["hatchling", "grpcio-tools>=1.50.0"]
build-backend = "hatchling.build"

[project]
name = "salesforce-zerobus"
version = "1.0.0"
description = "Simple Python library for streaming Salesforce Change Data Capture events to Databricks Delta tables"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Grant Doyle", email = "grant.doyle@databricks.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers", 
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
keywords = ["salesforce", "databricks", "streaming", "cdc", "change-data-capture", "real-time"]
requires-python = ">=3.10"

dependencies = [
    # Core dependencies (major-version upper bounds for reproducibility)
    "grpcio>=1.50.0,<2.0.0",
    "grpcio-tools>=1.50.0,<2.0.0",
    "protobuf>=6.0.0,<7.0.0",
    # avro-python3 is effectively unmaintained (last release 2020); a swap to fastavro
    # is tracked as a follow-up in the plan file.
    "avro-python3>=1.10.0,<2.0.0",
    # Databricks dependencies
    "databricks-sdk>=0.20.0,<1.0.0",
    # Utility dependencies
    "bitstring>=4.0.0,<5.0.0",
    "certifi>=2022.0.0",
    "requests>=2.28.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "databricks-zerobus-ingest-sdk>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0", 
    "isort>=5.10.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/DoyleDev/Salesforce-Zerobus"
Documentation = "https://github.com/DoyleDev/Salesforce-Zerobus/blob/main/README.md"
Repository = "https://github.com/DoyleDev/Salesforce-Zerobus.git"
Issues = "https://github.com/DoyleDev/Salesforce-Zerobus/issues"

# Hatchling build configuration
[tool.hatch.build]
include = [
    "salesforce_zerobus/",
]

[tool.hatch.build.targets.wheel]
packages = ["salesforce_zerobus"]

# Development tools configuration  
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
# Exclude generated protobuf files (regex matched against the path).
extend-exclude = '(.*_pb2\.py$|.*_pb2_grpc\.py$)'

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*_pb2.py", "*_pb2_grpc.py"]

# mypy runs as a real-bug gate (undefined names, bad returns, incompatible types) rather
# than a full-annotation mandate: this is a pre-existing codebase that was never fully
# type-annotated. Progressive typing (flipping disallow_untyped_defs back on) is a
# follow-up; see the plan file.
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = false
ignore_missing_imports = true
exclude = [
    ".*_pb2.py",
    ".*_pb2_grpc.py",
]
